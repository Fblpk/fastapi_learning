services:
  db:
    image: postgres:16
    container_name: fastapi_db_compose
    environment:
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: fastapi_dev
      POSTGRES_DB: fastapi_learning
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: fastapi_app_compose
    environment:
      SECRET_KEY: dev-secret
      ASYNC_DATABASE_URL: postgresql+asyncpg://fastapi:fastapi_dev@db:5432/fastapi_learning
      SYNC_DATABASE_URL: postgresql+psycopg://fastapi:fastapi_dev@db:5432/fastapi_learning
      TEST_DATABASE_URL: postgresql+asyncpg://fastapi:fastapi_dev@db:5432/fastapi_learning_test
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  pgdata: